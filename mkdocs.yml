site_name: Tziakcha-fetcher Documentation
site_description: tziakcha-fetcher is designed to retrieve tziakcha game records, parse in-game moves, and provide a browser-safe public interface.
site_url: https://tziakcha-stats.github.io/tziakcha-fetcher/
repo_url: https://github.com/tziakcha-stats/tziakcha-fetcher
site_author: tziakcha-stats
repo_name: tziakcha-fetcher
edit_uri: 'https://github.com/tziakcha-stats/tziakcha-fetcher/edit/main/docs'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - fenced_code
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 接入与 API:
      - 快速开始: getting-started/quick-start.md
      - 公开 API: getting-started/public-api.md
  - 牌谱与分析:
      - 牌谱 API: record/record_api.md
      - Node 分析: analyze/node_analyze.md
      - 对局统计: stats/session_summary.md
  - 数据与参考:
      - session 与 URL: base/session-and-url.md
      - 牌谱 Step 数据: base/record_step.md
      - action 常量与位字段: base/action_constants.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tziakcha-stats/tziakcha-fetcher
